# /etc/nginx/sites-available/novi 로 복사해서 쓴다 (README.md 6·9단계, update.sh가 배포 때마다 복사)
# 프론트(React 빌드 결과)와 백엔드(Django)를 한 주소로 서비스한다.
# 브라우저 입장에서는 같은 서버라서 세션 쿠키·CSRF가 개발 때(Vite 프록시)와 똑같이 동작한다.
#
# HTTPS (2026-11-15): 도메인 novi-dscd.duckdns.org, Let's Encrypt 인증서.
# 새 서버에 처음 설치할 때는 인증서가 없어서 nginx -t가 실패한다 → README.md 9단계대로 인증서부터 받는다.

# HTTP(80): 인증서 갱신 확인 경로만 두고, 나머지는 모두 HTTPS 도메인 주소로 보낸다 (IP로 들어와도)
server {
    listen 80;
    server_name novi-dscd.duckdns.org 43.200.135.63 _;

    # certbot renew가 확인 파일을 여기에 둔다 (webroot 방식)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://novi-dscd.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name novi-dscd.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/novi-dscd.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novi-dscd.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # 프론트: npm run build 결과
    root /srv/novi/Frontend/NOVI/dist;
    index index.html;

    # 백엔드 API·관리자 페이지 → gunicorn
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django가 HTTPS 요청인 걸 안다 (.env DJANGO_HTTPS=True)
        proxy_read_timeout 120s;   # 서버를 켠 직후 엔진을 불러오는 동안(약 90초) 들어온 추천 요청이 기다린다
    }

    # 관리자 페이지 CSS (python manage.py collectstatic)
    location /static/ {
        alias /srv/novi/Backend/staticfiles/;
    }

    # React Router 주소(/mypage 등)를 새로고침해도 index.html을 준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
