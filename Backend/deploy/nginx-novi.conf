# /etc/nginx/sites-available/novi 로 복사해서 쓴다 (README.md 6단계)
# 프론트(React 빌드 결과)와 백엔드(Django)를 한 주소로 서비스한다.
# 브라우저 입장에서는 같은 서버라서 세션 쿠키·CSRF가 개발 때(Vite 프록시)와 똑같이 동작한다.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 프론트: npm run build 결과
    root /srv/novi/Frontend/NOVI/dist;
    index index.html;

    # 백엔드 API·관리자 페이지 → gunicorn
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 서버를 켜고 첫 추천은 엔진을 불러오느라 오래 걸린다
    }

    # 관리자 페이지 CSS (python manage.py collectstatic)
    location /static/ {
        alias /srv/novi/Backend/staticfiles/;
    }

    # React Router 주소(/mypage 등)를 새로고침해도 index.html을 준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
